openapi: 3.2.0
info:
  title: Trakt Certifications API
  description: 'The Trakt API is a RESTful API for integrating TV show and movie tracking

    features into applications.'
  version: '2.0'
  contact:
    name: Trakt API Support
    url: https://forums.trakt.tv
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://api.trakt.tv
  description: Production
- url: https://api-staging.trakt.tv
  description: Staging
security:
- bearerAuth: []
tags:
- name: Certifications
  description: Movie and show certification reference data.
paths:
  /certifications/{type}:
    get:
      tags:
      - Certifications
      operationId: getCertifications
      summary: Get Certifications
      description: Reference list of certifications for movies or shows.
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum:
          - movies
          - shows
      responses:
        '200':
          description: Certifications.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 access token from /oauth/token or /oauth/device/token. Send via Authorization header and required headers trakt-api-version (2) and trakt-api-key (client_id).
